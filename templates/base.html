<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopAlpha</title>
<style>
:root{--p:#6d28d9;--p2:#ec4899;--bg:#f6f5fb;--t:#1f1b2e}
*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--t)}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:9;background:#fff;box-shadow:0 2px 12px #0001;padding:12px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.logo{font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;color:transparent}
nav form.s{flex:1;min-width:200px}nav input{width:100%;padding:10px 16px;border-radius:99px;border:1px solid #ddd;background:#f3f2f8}
nav button.l{background:none;border:0;font:inherit;cursor:pointer}.badge{background:var(--p2);color:#fff;border-radius:99px;padding:1px 8px;font-size:.8rem}
.hero{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;padding:56px 28px;text-align:center}
.hero h1{margin:0 0 8px;font-size:2.4rem}main{max-width:1180px;margin:0 auto;padding:24px 18px}
.pills a{display:inline-block;padding:7px 16px;margin:0 6px 8px 0;border-radius:99px;background:#fff;box-shadow:0 1px 4px #0001;font-size:.92rem}
.pills a.on,.pills a:hover{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001;transition:.2s;position:relative}
.grid .card:hover{transform:translateY(-6px);box-shadow:0 12px 28px #6d28d933}
.card img{width:100%;height:180px;object-fit:cover;display:block}.card .b{padding:14px}.card h3{margin:0 0 6px;font-size:1rem}
.price{font-weight:800;font-size:1.1rem}.old{color:#999;text-decoration:line-through;font-size:.85rem;margin-left:6px}
.off{position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:700}
.star{color:#f59e0b;font-size:.9rem}.btn{display:inline-block;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border:0;padding:9px 18px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px #0001}
table{width:100%;border-collapse:collapse}td{padding:12px 6px;border-bottom:1px solid #eee;vertical-align:middle}td img{width:64px;height:64px;border-radius:10px;object-fit:cover}
input,textarea,select{padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit;width:100%}.qty a{border:1px solid #ddd;border-radius:6px;padding:2px 9px}
footer{text-align:center;color:#888;padding:30px}
</style></head><body>
<nav><a class="logo" href="{% url 'home' %}">🛍 ShopAlpha</a>
<form class="s" action="{% url 'home' %}"><input name="q" placeholder="Search for products..." value="{{ q }}"></form>
<a href="{% url 'cart' %}">🛒 Cart <span class="badge">{{ cart_count }}</span></a>
{% if user.is_authenticated %}<a href="{% url 'orders' %}">My Orders</a><span>Hi, {{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="l">Logout</button></form>
{% else %}<a href="{% url 'login' %}">Login</a><a class="btn" href="{% url 'register' %}">Sign up</a>{% endif %}</nav>
{% block hero %}{% endblock %}<main>{% block content %}{% endblock %}</main><footer>© ShopAlpha · Built with Django · CodeAlpha Internship</footer></body></html>
